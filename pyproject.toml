[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asistente-bi-mcp"
version = "0.1.0"
description = "Servidor MCP local para modelado de datos y desarrollo de dashboards"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
asistente-bi-mcp = "servidor_mcp.servidor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
servidor_mcp = ["conocimiento/*.md"]
